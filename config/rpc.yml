# Tier 3 on-chain configuration: public RPC endpoints, Multicall3, token addresses.
#
# Multicall3 is deployed at the SAME address on every chain listed here, including
# Monad, Hyperliquid and Plasma (verified against mds1/multicall3 deployments.json).
multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"

# Decimals are ALWAYS read on-chain via decimals() and cached - never taken from this file.
# BSC USDC and USDT are 18 decimals, not 6; hardcoding 6 would inflate them by 1e12.
# Addresses marked `verified: false` are probed with symbol()/decimals() at startup and
# dropped (not guessed) if the probe fails.

chains:
  Ethereum:
    chain_id: 1
    rpc: ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com", "https://rpc.ankr.com/eth"]
    tokens:
